[package]
name = "proxima"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "HTTPS debugging proxy and API client: see every request your phone makes, then replay it"
license = "MIT"
repository = "https://github.com/themoretheless/proxima"
default-run = "proxima"

[dependencies]
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time",
  "signal",
] }
futures-util = "0.3"

# HTTP core. hyper speaks both 1.1 and 2, which the proxy needs in both
# directions. Connections are driven directly through hyper::server::conn and
# hyper::client::conn, so all that is wanted from hyper-util is the tokio glue.
hyper = { version = "1.11", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"

# TLS. The ring provider is deliberate: aws-lc-rs needs cmake, which is not a
# reasonable thing to require of someone cloning a debugging tool.
rustls = { version = "0.23", default-features = false, features = [
  "std",
  "tls12",
  "ring",
  "logging",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "tls12",
  "ring",
  "logging",
] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }

# Inspector API, live event socket and the pages this binary serves.
axum = { version = "0.8", features = ["ws"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

# Content decoding for captured bodies.
flate2 = "1"
brotli = "8"
zstd = "0.13"

base64 = "0.22"
regex = "1"
sha2 = "0.10"
rand = "0.9"
time = { version = "0.3", features = ["formatting"] }
anyhow = "1"
local-ip-address = "0.6"
x509-parser = "0.18.1"
# The native window. Optional and off by default: it drags in winit and a GL
# stack, which is a minute of build time nobody running the CLI should pay for.
# glow rather than wgpu because the inspector draws text and rectangles, and
# wgpu's driver surface is a large thing to depend on for that.
eframe = { version = "0.32", default-features = false, features = [
  "default_fonts",
  "glow",
  "wayland",
  "x11",
], optional = true }

# The traffic archive. Optional and off by default for the same reason as the
# window: `bundled` compiles DuckDB's C++ amalgamation, which is minutes of cold
# build and tens of megabytes of binary. Someone who only wants to watch requests
# go by should not pay that. `bundled` rather than a system library because the
# alternative is asking every user to install a matching libduckdb first.
duckdb = { version = "1.10505", features = ["bundled"], optional = true }

# QUIC / HTTP/3 over UDP. Optional: pulls quinn and h3, which most users of the
# TCP HTTPS proxy never need. Reverse and future WireGuard paths live behind
# this feature so the default binary stays small and builds without a UDP stack.
# quinn is ring-only (rustls-ring); never enable rustls-aws-lc-rs here.
quinn = { version = "0.11", default-features = false, features = [
  "rustls-ring",
  "runtime-tokio",
  "log",
], optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
# Dual-stack UDP bind (IPV6_V6ONLY) for the quic feature. Already pulled by
# quinn/tokio; listed so src/quic/udp.rs does not rely on a transitive dep.
socket2 = { version = "0.6", optional = true }

# WireGuard crypto (Noise_IKpsk2_25519_ChaChaPoly_BLAKE2s). Optional so the
# default binary stays free of Noise deps; enabled with --features wireguard.
x25519-dalek = { version = "2", optional = true, features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", optional = true }
blake2 = { version = "0.10", optional = true, features = ["std"] }
subtle = { version = "2", optional = true }

# JSON pretty-print and semantic highlighting for the inspector (bodies, frames).
# Sibling checkout: ../tokenizer (same layout as local Sources tree).
themoretheless-tokenizer = { path = "../tokenizer" }

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-manual-roots",
] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[features]
# Empty default: gui, archive, quic, wireguard, and tun stay opt-in like each other.
default = []
gui = ["dep:eframe"]
archive = ["dep:duckdb"]
quic = ["dep:quinn", "dep:h3", "dep:h3-quinn", "dep:socket2"]
# WireGuard userspace device-join path. Pulls x25519 + chacha20poly1305 for
# Noise_IK handshake and transport. Config/CLI/status are always compiled;
# crypto listen path is cfg-gated behind this feature.
wireguard = ["dep:x25519-dalek", "dep:chacha20poly1305", "dep:blake2", "dep:subtle"]
# Local TUN / packet-capture scaffold. Empty: no tun/pcap crate yet.
# Config/CLI/status fields are always compiled; the serve module is cfg-gated.
tun = []

[[bin]]
name = "proxima"
path = "src/main.rs"

[[bin]]
name = "proxima-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

# Localhost reverse-H3 MITM integration test. Built only with --features quic
# so default `cargo test` never links quinn/h3.
[[test]]
name = "quic_reverse_e2e"
path = "tests/quic_reverse_e2e.rs"
required-features = ["quic"]

# QUIC public-API smoke (bind, crypto, localhost 1-RTT). External-net cases
# are #[ignore] so offline CI stays green; run with -- --ignored when online.
[[test]]
name = "quic_smoke"
path = "tests/quic_smoke.rs"
required-features = ["quic"]
